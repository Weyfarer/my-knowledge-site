name: Deploy Quartz site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private notes (vault repo)
        env:
          KB_TOKEN: ${{ secrets.KB_DEPLOY_TOKEN }}
        run: |
          # 仓库名按需修改�?你的账号>/my-knowledge
          git clone --depth 1 "https://x-access-token:${KB_TOKEN}@github.com/${{ github.repository_owner }}/my-knowledge.git" content
          rm -rf content/.git content/.obsidian

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
